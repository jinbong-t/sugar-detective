<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>당류 탐정 수사대 - 지휘 통제실</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(20, 27, 45, 0.7);
      --accent-main: #00ffcc;
      --accent-danger: #ff3366;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 255, 204, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(255, 51, 102, 0.08), transparent 25%);
      color: var(--text-main);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--glass-border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-icon {
      font-size: 40px;
      filter: drop-shadow(0 0 10px var(--accent-main));
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
    }
    
    h1 span {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 24px;
      color: var(--text-muted);
      text-shadow: none;
      letter-spacing: normal;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--accent-main);
      box-shadow: 0 0 15px var(--accent-main);
    }

    .stat-card.danger::before {
      background: var(--accent-danger);
      box-shadow: 0 0 15px var(--accent-danger);
    }

    .stat-title {
      font-size: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #fff;
    }

    .table-container {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow-x: auto;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .table-header h2 {
      margin: 0;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pulse {
      width: 10px;
      height: 10px;
      background-color: var(--accent-danger);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-danger);
      animation: pulse 1.5s infinite;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    th {
      text-align: left;
      padding: 15px;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--glass-border);
      white-space: nowrap;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #cbd5e1;
      vertical-align: top;
    }

    tbody tr {
      transition: all 0.3s ease;
    }

    tbody tr:hover {
      background: rgba(255,255,255,0.03);
      transform: scale(1.01);
    }

    .team-badge {
      display: inline-block;
      background: rgba(0, 255, 204, 0.1);
      color: var(--accent-main);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      white-space: nowrap;
    }

    .reflection-text {
      max-width: 400px;
      line-height: 1.5;
      font-size: 14px;
      color: #94a3b8;
    }

    .time-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
    }
    
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 255, 204, 0.3);
      border-radius: 50%;
      border-top-color: var(--accent-main);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px var(--accent-danger); }
      100% { transform: scale(0.95); opacity: 0.5; }
    }
    
    @keyframes rowSlideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>
<body>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div style="font-family: 'Orbitron', sans-serif; color: var(--accent-main); letter-spacing: 2px;">CONNECTING TO SERVER...</div>
  </div>

  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">🕵️‍♂️</div>
        <h1>당류탐정수사대 <span>지휘 통제실</span></h1>
      </div>
      <div style="font-family: 'Orbitron', sans-serif; color: var(--accent-main);">
        STATUS: <span style="color: #00ffcc;">ONLINE</span>
      </div>
    </header>

    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-title">총 탈출 성공 팀</div>
        <div class="stat-value" id="total-teams">0</div>
      </div>
      <div class="stat-card danger">
        <div class="stat-title">최근 작전 완료 시간</div>
        <div class="stat-value" id="latest-time" style="font-size: 24px; line-height: 1.5; margin-top: 5px;">--:--:--</div>
      </div>
    </div>

    <div class="table-container">
      <div class="table-header">
        <h2><div class="pulse"></div> 실시간 수사 보고 현황</h2>
      </div>
      <table>
        <thead>
          <tr>
            <th>팀/조</th>
            <th>제출자 정보</th>
            <th>참여 대원</th>
            <th>최종 소감 및 보고</th>
            <th>보고 시간</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- 데이터가 여기에 동적으로 추가됩니다 -->
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { db, collection, onSnapshot, query, orderBy } from './firebase-config.js';

    const tableBody = document.getElementById('table-body');
    const totalTeamsEl = document.getElementById('total-teams');
    const latestTimeEl = document.getElementById('latest-time');
    const loadingEl = document.getElementById('loading');

    // 실시간 데이터 리스너 설정
    const q = query(collection(db, "investigations"), orderBy("timestamp", "desc"));
    
    onSnapshot(q, (snapshot) => {
      loadingEl.style.opacity = '0';
      setTimeout(() => loadingEl.style.display = 'none', 500);

      tableBody.innerHTML = '';
      totalTeamsEl.innerText = snapshot.size;

      let isFirst = true;

      snapshot.forEach((doc) => {
        const data = doc.data();
        let timeStr = "--:--:--";
        if(data.timestamp) {
          const date = data.timestamp.toDate();
          timeStr = date.toLocaleTimeString('ko-KR', { hour12: false });
          
          if(isFirst) {
            latestTimeEl.innerText = timeStr;
            isFirst = false;
          }
        }

        const tr = document.createElement('tr');
        tr.style.animation = 'rowSlideIn 0.4s ease-out forwards';
        
        tr.innerHTML = `
          <td><span class="team-badge">${data.teamName || '미입력'}</span></td>
          <td>
            <div style="font-weight: bold; color: #fff;">${data.studentName || '이름 없음'}</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">학번: ${data.studentId || '-'}</div>
          </td>
          <td><div style="max-width: 200px; line-height: 1.4;">${data.memberNames || '-'}</div></td>
          <td><div class="reflection-text">${data.reflection || '-'}</div></td>
          <td><span class="time-badge">${timeStr}</span></td>
        `;
        tableBody.appendChild(tr);
      });
      
      if(snapshot.empty) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">아직 접수된 수사 보고가 없습니다.</td></tr>`;
      }
    }, (error) => {
      console.error("Error fetching data: ", error);
      alert("데이터를 불러오는 중 오류가 발생했습니다. Firebase 설정을 확인해주세요.");
      loadingEl.style.display = 'none';
    });
  </script>
</body>
</html>
