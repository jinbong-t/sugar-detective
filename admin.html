<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>당류 탐정 수사대 - 지휘 통제실</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(20, 27, 45, 0.7);
      --accent-main: #00ffcc;
      --accent-danger: #ff3366;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 255, 204, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(255, 51, 102, 0.08), transparent 25%);
      color: var(--text-main);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--glass-border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-icon {
      font-size: 40px;
      filter: drop-shadow(0 0 10px var(--accent-main));
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
    }
    
    h1 span {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 24px;
      color: var(--text-muted);
      text-shadow: none;
      letter-spacing: normal;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--accent-main);
      box-shadow: 0 0 15px var(--accent-main);
    }

    .stat-card.danger::before {
      background: var(--accent-danger);
      box-shadow: 0 0 15px var(--accent-danger);
    }

    .stat-title {
      font-size: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #fff;
    }

    .table-container {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow-x: auto;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .table-header h2 {
      margin: 0;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pulse {
      width: 10px;
      height: 10px;
      background-color: var(--accent-danger);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-danger);
      animation: pulse 1.5s infinite;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    th {
      text-align: left;
      padding: 15px;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--glass-border);
      white-space: nowrap;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #cbd5e1;
      vertical-align: top;
    }

    tbody tr {
      transition: all 0.3s ease;
    }

    tbody tr:hover {
      background: rgba(255,255,255,0.03);
      transform: scale(1.01);
    }

    .team-badge {
      display: inline-block;
      background: rgba(0, 255, 204, 0.1);
      color: var(--accent-main);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      white-space: nowrap;
    }

    .reflection-text {
      max-width: 400px;
      line-height: 1.5;
      font-size: 14px;
      color: #94a3b8;
    }

    .time-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
    }
    
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 255, 204, 0.3);
      border-radius: 50%;
      border-top-color: var(--accent-main);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px var(--accent-danger); }
      100% { transform: scale(0.95); opacity: 0.5; }
    }
    
    @keyframes rowSlideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stage-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .stage-1 { background: rgba(255, 204, 0, 0.2); color: #ffcc00; border: 1px solid rgba(255, 204, 0, 0.5); }
    .stage-2 { background: rgba(0, 255, 0, 0.2); color: #00ff00; border: 1px solid rgba(0, 255, 0, 0.5); }
    .stage-3 { background: rgba(0, 153, 255, 0.2); color: #0099ff; border: 1px solid rgba(0, 153, 255, 0.5); }
    .stage-clear { background: rgba(204, 0, 255, 0.2); color: #cc00ff; border: 1px solid rgba(204, 0, 255, 0.5); box-shadow: 0 0 10px rgba(204, 0, 255, 0.3); }

    .eval-select {
      background: #111;
      color: #e2e8f0;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px;
      margin-bottom: 5px;
      width: 100%;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div style="font-family: 'Orbitron', sans-serif; color: var(--accent-main); letter-spacing: 2px;">CONNECTING TO SERVER...</div>
  </div>

  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">🕵️‍♂️</div>
        <h1>당류탐정수사대 <span>지휘 통제실</span></h1>
      </div>
      <div style="font-family: 'Orbitron', sans-serif; color: var(--accent-main);">
        STATUS: <span style="color: #00ffcc;">ONLINE</span>
      </div>
    </header>

    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-title">총 탈출 성공 팀</div>
        <div class="stat-value" id="total-teams">0</div>
      </div>
      <div class="stat-card danger">
        <div class="stat-title">최근 작전 완료 시간</div>
        <div class="stat-value" id="latest-time" style="font-size: 24px; line-height: 1.5; margin-top: 5px;">--:--:--</div>
      </div>
    </div>

    <div class="table-container">
      <div class="table-header">
        <h2><div class="pulse"></div> 실시간 수사 보고 현황</h2>
        <div style="display: flex; gap: 10px; align-items: center;">
          <select id="class-filter" style="padding: 8px; border-radius: 5px; background: rgba(0,255,204,0.1); color: #00ffcc; border: 1px solid #00ffcc;">
            <option value="">모든 반 보기</option>
          </select>
          <button id="btn-export" style="padding: 8px 15px; border-radius: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid white; cursor: pointer;">엑셀 저장</button>
          <button id="btn-reset" style="padding: 8px 15px; border-radius: 5px; background: rgba(255,51,102,0.1); color: #ff3366; border: 1px solid #ff3366; cursor: pointer;">초기화</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>팀/조</th>
            <th>제출자 정보</th>
            <th>진행 상황</th>
            <th>참여 대원</th>
            <th>최종 소감 및 보고</th>
            <th>과정중심평가 (자동저장)</th>
            <th>활동 시간</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- 데이터가 여기에 동적으로 추가됩니다 -->
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { db, collection, onSnapshot, query, orderBy, getDocs, deleteDoc, doc, updateDoc } from './firebase-config.js';

    const tableBody = document.getElementById('table-body');
    const totalTeamsEl = document.getElementById('total-teams');
    const latestTimeEl = document.getElementById('latest-time');
    const loadingEl = document.getElementById('loading');
    const classFilter = document.getElementById('class-filter');
    const btnExport = document.getElementById('btn-export');
    const btnReset = document.getElementById('btn-reset');

    let allData = [];
    let classList = new Set();

    // 실시간 데이터 리스너 설정
    const q = query(collection(db, "investigations"), orderBy("timestamp", "desc"));
    
    onSnapshot(q, (snapshot) => {
      loadingEl.style.opacity = '0';
      setTimeout(() => loadingEl.style.display = 'none', 500);

      allData = [];
      let tempClassList = new Set();

      snapshot.forEach((docSnapshot) => {
        const data = docSnapshot.data();
        data.id = docSnapshot.id;
        
        if (data.studentId && data.studentId.length >= 2) {
          let classStr = data.studentId.substring(0, 2) + "반";
          data.classStr = classStr;
          tempClassList.add(classStr);
        } else {
          data.classStr = "미분류";
        }

        allData.push(data);
      });

      updateClassFilterOptions(tempClassList);
      renderTable();

    }, (error) => {
      console.error("Error fetching data: ", error);
      alert("데이터를 불러오는 중 오류가 발생했습니다. Firebase 설정을 확인해주세요.");
      loadingEl.style.display = 'none';
    });

    function updateClassFilterOptions(newClassSet) {
      const currentSelected = classFilter.value;
      let sortedClasses = Array.from(newClassSet).sort();
      
      classFilter.innerHTML = '<option value="">모든 반 보기</option>';
      sortedClasses.forEach(cls => {
        let opt = document.createElement('option');
        opt.value = cls;
        opt.innerText = cls;
        classFilter.appendChild(opt);
      });

      if (newClassSet.has(currentSelected)) {
        classFilter.value = currentSelected;
      }
    }

    function renderTable() {
      tableBody.innerHTML = '';
      let filteredData = allData;
      
      if (classFilter.value !== "") {
        filteredData = allData.filter(d => d.classStr === classFilter.value);
      }

      totalTeamsEl.innerText = filteredData.length;
      
      let isFirst = true;
      if(filteredData.length > 0) {
          const firstData = filteredData[0];
          if(firstData.timestamp) {
              latestTimeEl.innerText = firstData.timestamp.toDate().toLocaleTimeString('ko-KR', { hour12: false });
          } else {
              latestTimeEl.innerText = "--:--:--";
          }
      } else {
          latestTimeEl.innerText = "--:--:--";
      }

      filteredData.forEach((data) => {
        let timeStr = "기록 없음";
        if(data.activityTime !== undefined && data.status === 'CLEAR') {
          let m = Math.floor(data.activityTime / 60);
          let s = data.activityTime % 60;
          timeStr = `${m}분 ${s}초`;
        }

        let stageClass = "stage-1";
        if(data.status === "STAGE 2") stageClass = "stage-2";
        else if(data.status === "STAGE 3") stageClass = "stage-3";
        else if(data.status === "CLEAR") stageClass = "stage-clear";
        
        let displayStatus = data.status || "STAGE 1";

        const tr = document.createElement('tr');
        tr.style.animation = 'rowSlideIn 0.4s ease-out forwards';
        
        tr.innerHTML = `
          <td><span class="team-badge">${data.teamName || '미입력'}</span></td>
          <td>
            <div style="font-weight: bold; color: #fff;">${data.studentName || '이름 없음'}</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">학번: ${data.studentId || '-'}</div>
          </td>
          <td><span class="stage-badge ${stageClass}">${displayStatus}</span></td>
          <td><div style="max-width: 150px; line-height: 1.4;">${data.memberNames || '-'}</div></td>
          <td><div class="reflection-text" style="max-width: 250px;">${data.reflection || '-'}</div></td>
          <td>
            <div style="margin-bottom: 5px;">
              <span style="font-size: 11px; color:#94a3b8;">협업능력:</span><br>
              <select class="eval-select collab-eval" data-id="${data.id}">
                <option value="">평가 안함</option>
                <option value="상" ${data.collabEval === '상' ? 'selected' : ''}>상 (매우우수)</option>
                <option value="중" ${data.collabEval === '중' ? 'selected' : ''}>중 (보통)</option>
                <option value="하" ${data.collabEval === '하' ? 'selected' : ''}>하 (노력요함)</option>
              </select>
            </div>
            <div>
              <span style="font-size: 11px; color:#94a3b8;">문제해결력:</span><br>
              <select class="eval-select prob-eval" data-id="${data.id}">
                <option value="">평가 안함</option>
                <option value="상" ${data.probEval === '상' ? 'selected' : ''}>상 (매우우수)</option>
                <option value="중" ${data.probEval === '중' ? 'selected' : ''}>중 (보통)</option>
                <option value="하" ${data.probEval === '하' ? 'selected' : ''}>하 (노력요함)</option>
              </select>
            </div>
          </td>
          <td><span class="time-badge">${timeStr}</span></td>
        `;
        tableBody.appendChild(tr);
      });
      
      // 평가 변경 이벤트 리스너 달기
      document.querySelectorAll('.collab-eval').forEach(sel => {
        sel.addEventListener('change', (e) => updateEval(e.target.dataset.id, 'collabEval', e.target.value));
      });
      document.querySelectorAll('.prob-eval').forEach(sel => {
        sel.addEventListener('change', (e) => updateEval(e.target.dataset.id, 'probEval', e.target.value));
      });
      
      if(filteredData.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">아직 접수된 수사 보고가 없습니다.</td></tr>`;
      }
    }

    // 과정중심평가 업데이트 함수 (디바운스나 별도 피드백 없이 조용히 저장)
    async function updateEval(docId, field, value) {
      try {
        await updateDoc(doc(db, "investigations", docId), {
          [field]: value
        });
      } catch(e) {
        console.error("평가 저장 오류: ", e);
      }
    }

    classFilter.addEventListener('change', renderTable);

    // 초기화 기능
    btnReset.addEventListener('click', async () => {
      if(confirm("정말로 모든 수사 기록을 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) {
        loadingEl.style.opacity = '1';
        loadingEl.style.display = 'flex';
        try {
          const querySnapshot = await getDocs(collection(db, "investigations"));
          const deletePromises = [];
          querySnapshot.forEach((document) => {
            deletePromises.push(deleteDoc(doc(db, "investigations", document.id)));
          });
          await Promise.all(deletePromises);
          alert("초기화가 완료되었습니다.");
        } catch (e) {
          console.error("초기화 중 오류 발생: ", e);
          alert("초기화 중 오류가 발생했습니다.");
        }
        loadingEl.style.opacity = '0';
        setTimeout(() => loadingEl.style.display = 'none', 500);
      }
    });

    // 엑셀(CSV) 내보내기 기능
    btnExport.addEventListener('click', () => {
      if(allData.length === 0) {
        alert("내보낼 데이터가 없습니다.");
        return;
      }

      let filteredData = allData;
      if (classFilter.value !== "") {
        filteredData = allData.filter(d => d.classStr === classFilter.value);
      }

      let csvContent = "\uFEFF팀/조,이름,학번,진행상황,참여대원,소감문,협업능력,문제해결력,활동시간(초),활동시간(분초),보고시간\n";
      
      filteredData.forEach(d => {
        let team = '"' + (d.teamName || '').replace(/"/g, '""') + '"';
        let name = '"' + (d.studentName || '').replace(/"/g, '""') + '"';
        let id = '"' + (d.studentId || '').replace(/"/g, '""') + '"';
        let status = '"' + (d.status || 'STAGE 1') + '"';
        let members = '"' + (d.memberNames || '').replace(/"/g, '""') + '"';
        let ref = '"' + (d.reflection || '').replace(/"/g, '""') + '"';
        let collab = '"' + (d.collabEval || '') + '"';
        let prob = '"' + (d.probEval || '') + '"';
        
        let actSec = (d.activityTime !== undefined && d.status === 'CLEAR') ? d.activityTime : '';
        let actStr = "";
        if(d.activityTime !== undefined && d.status === 'CLEAR') {
           actStr = `${Math.floor(d.activityTime / 60)}분 ${d.activityTime % 60}초`;
        }
        let actFmt = '"' + actStr + '"';
        
        let timeStr = "";
        if(d.timestamp) {
           timeStr = '"' + d.timestamp.toDate().toLocaleString('ko-KR') + '"';
        }

        csvContent += `${team},${name},${id},${status},${members},${ref},${collab},${prob},${actSec},${actFmt},${timeStr}\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `당류탐정수사대_기록_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
